[project]
name = "coding-agent"
version = "0.1.0"
description = "A lightweight single-agent coding agent implemented from scratch"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # LLM API（OpenAI 兼容）
    "openai>=1.30.0",

    # OpenAI SDK 依赖 httpx2（fork 版 httpx），这里显式声明以便 lint/锁定版本
    "httpx2>=2.7.0,<3.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # 配置
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Token 估算
    "tiktoken>=0.7.0",

    # 日志
    "structlog>=24.1.0",

    # TUI
    "textual>=0.60.0",

    # 其它工具
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line-too-long 由 formatter 处理

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic Option/Argument usage triggers B008 by design.
"src/coding_agent/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
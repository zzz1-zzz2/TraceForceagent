name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # editable install + dev extras (pytest)
          pip install -e ".[dev]"

      - name: Run unit test suite
        # P1-8 验收门：所有 unit test 必须保持全绿。
        # 当前基线：173 passed。
        # 任何 failure 都视为 P1 Core 回归,不能合入 main。
        run: |
          python -m pytest tests/ -q --maxfail=1 --tb=short

      - name: Smoke-check CLI loads
        # 不依赖 ripgrep / API key,只验证 CLI module 能正常 import + typer
        # 能枚举子命令。Environment readiness 留给 `python -m coding_agent check`
        # 在本地或带 secrets 的环境里跑。
        run: |
          python -m coding_agent --version
          python -m coding_agent run --help
          python -m coding_agent tui --help || true